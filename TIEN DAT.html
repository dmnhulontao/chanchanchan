  .transition { transition: color .15s ease, background-color .15s ease, border-color .15s ease, opacity .15s ease, box-shadow .15s ease; }
  .bg-gradient-to-br { background-image: linear-gradient(to bottom right, #9333ea, #4f46e5 55%, #4338ca); }
  .bg-gradient-to-r { background-image: linear-gradient(to right, #9333ea, #4f46e5); }
  .hover\:opacity-90:hover { opacity: 0.9; }
  .disabled\:opacity-40:disabled { opacity: 0.4; cursor: not-allowed; }
  .focus\:outline-none:focus { outline: none; }

  /* ---------- Toast ---------- */
  .fixed { position: fixed; }

  .-translate-x-1\/2 { transform: translateX(-50%); }

  .toast.show { opacity: 1; transform: translateY(0); }

<body class="min-h-screen">
<div class="theme-ctv min-h-screen">
  <div class="min-h-screen bg-[#080b14] flex items-center justify-center p-4">
    <div class="w-full max-w-sm">

      <div class="text-center mb-8">
        <div class="w-20 h-20 mx-auto mb-4 rounded-3xl bg-gradient-to-br from-purple-600 via-indigo-600 to-indigo-700 flex items-center justify-center shadow-2xl shadow-purple-900/60">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-crown w-10 h-10 text-amber-300" aria-hidden="true">
            <path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"></path>
            <path d="M5 21h14"></path>
          </svg>
        </div>
        <h1 class="text-2xl font-black text-white tracking-tight">TIEN DAT</h1>
        <p class="text-slate-400 text-sm mt-1 flex items-center justify-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block"></span>Locket Gold v2.0
        </p>
      </div>

      <form id="loginForm" class="bg-[#111827] border border-white/[0.08] rounded-3xl p-6 space-y-4 shadow-2xl" novalidate>
        <div class="space-y-1.5">
          <label class="text-xs font-bold text-slate-400" for="username">Tên đăng nhập</label>
          <input id="username" name="username" autocomplete="username" placeholder="username" required
                 class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white text-sm focus:outline-none focus:border-purple-500 transition placeholder:text-slate-600" value="" />
        </div>
        <div class="space-y-1.5">
          <label class="text-xs font-bold text-slate-400" for="password">Mật khẩu</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required
                 class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white text-sm focus:outline-none focus:border-purple-500 transition placeholder:text-slate-600" value="" />
        </div>
        <button id="submitBtn" type="submit" disabled
                class="w-full py-3.5 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:opacity-90 text-white font-black text-sm disabled:opacity-40 transition flex items-center justify-center gap-2">
          <span>Đăng nhập</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right w-4 h-4" aria-hidden="true">
            <path d="m9 18 6-6-6-6"></path>
          </svg>
        </button>
      </form>

    </div>
  </div>
</div>

<div id="toasts" class="fixed top-4 left-1/2 -translate-x-1/2 sm:left-auto sm:right-4 sm:translate-x-0 z-[60] flex flex-col gap-2 w-[calc(100%-2rem)] sm:w-80 pointer-events-none"></div>

<script>
  (function () {
    var form = document.getElementById('loginForm');
    var user = document.getElementById('username');
    var pass = document.getElementById('password');
    var btn = document.getElementById('submitBtn');
    var wrap = document.getElementById('toasts');

    function sync() {
      btn.disabled = !(user.value.trim().length > 0 && pass.value.length > 0);
    }
    user.addEventListener('input', sync);
    pass.addEventListener('input', sync);
    sync();

    function toast(msg, kind) {
      var el = document.createElement('div');
      el.className = 'toast' + (kind ? ' toast-' + kind : '');
      el.textContent = msg;
      wrap.appendChild(el);
      requestAnimationFrame(function () { el.classList.add('show'); });
      setTimeout(function () {
        el.classList.remove('show');
        setTimeout(function () { el.remove(); }, 250);
      }, 3600);
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (btn.disabled) return;
      toast('Bản offline: chưa kết nối được máy chủ xác thực. Mở trên tên miền gốc để đăng nhập thật.', 'warn');
    });
  })();
</script>
</body>
